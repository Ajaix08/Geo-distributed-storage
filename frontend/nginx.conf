server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — client-side routing (react-router) handles the rest
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /health {
    return 200 'OK';
    add_header Content-Type text/plain;
  }

  gzip on;
  gzip_types text/css application/javascript application/json;
}
